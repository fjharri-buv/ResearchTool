[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "Local Research Assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "httpx>=0.27.0"
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
reload = true
